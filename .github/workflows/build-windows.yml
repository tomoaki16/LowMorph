name: Build Windows VST3
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Clone VST3 SDK
        shell: pwsh
        run: git clone --recursive --depth 1 https://github.com/steinbergmedia/vst3sdk.git vst3sdk
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A x64 -DVST3_SDK_ROOT="$pwd/vst3sdk" -DSMTG_CREATE_PLUGIN_LINK=OFF
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release
      - name: Validate
        shell: pwsh
        run: |
          $validator = Get-ChildItem build -Recurse -Filter validator.exe | Select-Object -First 1
          $plugin = Get-ChildItem build -Recurse -Directory -Filter LowMorph.vst3 | Select-Object -First 1
          if (-not $validator) { throw "validator.exe not found" }
          if (-not $plugin) { throw "LowMorph.vst3 not found" }
          & $validator.FullName $plugin.FullName
          if ($LASTEXITCODE -ne 0) { throw "VST3 validator failed with exit code $LASTEXITCODE" }
      - name: Stage artifact
        shell: pwsh
        run: |
          $plugin = Get-ChildItem build -Recurse -Directory -Filter LowMorph.vst3 | Select-Object -First 1
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item $plugin.FullName artifact/LowMorph.vst3 -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: LowMorph-Windows-VST3
          path: artifact/LowMorph.vst3
